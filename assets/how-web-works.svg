<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes dash   { to { stroke-dashoffset: -20; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  #arrow-1 { stroke-dasharray: 6 4; animation: dash 0.4s linear infinite; }
  #arrow-2 { stroke-dasharray: 6 4; animation: dash 0.4s linear infinite; }

  #html-arrow { stroke-dasharray: 6 4; animation: dash 0.5s linear infinite; }
  #css-arrow  { stroke-dasharray: 6 4; animation: dash 0.5s linear infinite -0.17s; }
  #js-arrow   { stroke-dasharray: 6 4; animation: dash 0.5s linear infinite -0.34s; }

  #box-html    { opacity: 0; animation: fadein 0.4s ease 0.5s forwards; }
  #box-css     { opacity: 0; animation: fadein 0.4s ease 0.9s forwards; }
  #box-js      { opacity: 0; animation: fadein 0.4s ease 1.3s forwards; }
  #box-webpage { opacity: 0; animation: fadein 0.5s ease 2.0s forwards; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- background -->
<rect width="680" height="520" fill="#0D1117"/>

<!-- 1. Browser box -->
<rect x="210" y="40" width="260" height="56" rx="8" fill="#161B22" stroke="#58A6FF" stroke-width="0.5"/>
<text x="340" y="63" text-anchor="middle" dominant-baseline="central" fill="#E6EDF3" font-family="Courier New, monospace" font-size="14" font-weight="bold">Your browser</text>
<text x="340" y="81" text-anchor="middle" dominant-baseline="central" fill="#58A6FF" font-family="Courier New, monospace" font-size="12">You type: google.com</text>

<!-- 2. Arrow 1 -->
<line id="arrow-1" x1="340" y1="96" x2="340" y2="133" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 3. Server box -->
<rect x="200" y="136" width="280" height="56" rx="8" fill="#161B22" stroke="#8B949E" stroke-width="0.5"/>
<text x="340" y="159" text-anchor="middle" dominant-baseline="central" fill="#E6EDF3" font-family="Courier New, monospace" font-size="14" font-weight="bold">Server receives request</text>
<text x="340" y="177" text-anchor="middle" dominant-baseline="central" fill="#8B949E" font-family="Courier New, monospace" font-size="12">Finds and packages the files</text>

<!-- 4. Arrow 2 -->
<line id="arrow-2" x1="340" y1="192" x2="340" y2="229" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 5. Three file boxes -->
<g id="box-html">
  <rect x="170" y="232" width="100" height="56" rx="6" fill="#0D2818" stroke="#3FB950" stroke-width="0.5"/>
  <text x="220" y="255" text-anchor="middle" dominant-baseline="central" fill="#E6EDF3" font-family="Courier New, monospace" font-size="14" font-weight="bold">HTML</text>
  <text x="220" y="273" text-anchor="middle" dominant-baseline="central" fill="#3FB950" font-family="Courier New, monospace" font-size="12">Structure</text>
</g>

<g id="box-css">
  <rect x="290" y="232" width="100" height="56" rx="6" fill="#0D2818" stroke="#3FB950" stroke-width="0.5"/>
  <text x="340" y="255" text-anchor="middle" dominant-baseline="central" fill="#E6EDF3" font-family="Courier New, monospace" font-size="14" font-weight="bold">CSS</text>
  <text x="340" y="273" text-anchor="middle" dominant-baseline="central" fill="#3FB950" font-family="Courier New, monospace" font-size="12">Style</text>
</g>

<g id="box-js">
  <rect x="410" y="232" width="100" height="56" rx="6" fill="#0D2818" stroke="#3FB950" stroke-width="0.5"/>
  <text x="460" y="255" text-anchor="middle" dominant-baseline="central" fill="#E6EDF3" font-family="Courier New, monospace" font-size="14" font-weight="bold">JavaScript</text>
  <text x="460" y="273" text-anchor="middle" dominant-baseline="central" fill="#3FB950" font-family="Courier New, monospace" font-size="12">Behavior</text>
</g>

<!-- 6. Three converging arrows -->
<line id="html-arrow" x1="220" y1="288" x2="340" y2="365" stroke="#3FB950" stroke-width="1.5" marker-end="url(#arrow)"/>
<line id="css-arrow"  x1="340" y1="288" x2="340" y2="365" stroke="#3FB950" stroke-width="1.5" marker-end="url(#arrow)"/>
<line id="js-arrow"   x1="460" y1="288" x2="340" y2="365" stroke="#3FB950" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 7. Webpage box -->
<g id="box-webpage">
  <rect x="210" y="368" width="260" height="56" rx="8" fill="#1A1040" stroke="#7C5CBF" stroke-width="0.5"/>
  <text x="340" y="391" text-anchor="middle" dominant-baseline="central" fill="#E6EDF3" font-family="Courier New, monospace" font-size="14" font-weight="bold">Working webpage</text>
  <text x="340" y="409" text-anchor="middle" dominant-baseline="central" fill="#A78BFA" font-family="Courier New, monospace" font-size="12">HTML + CSS + JS rendered</text>
</g>

</svg>
