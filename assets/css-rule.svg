<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Anatomy of a CSS rule</title>
  <desc>Diagram showing the four parts of a CSS rule: selector, property, value, and declaration</desc>

  <!-- Background -->
  <rect width="680" height="300" fill="#0D1117"/>

  <!-- Top label -->
  <text x="340" y="30" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11"
        letter-spacing="0.15em">ANATOMY OF A CSS RULE</text>

  <!-- Declaration dashed box (behind other parts) -->
  <rect x="222" y="100" width="192" height="52" rx="6"
        fill="none" stroke="#D29922" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Part 1: Selector "p" -->
  <rect x="155" y="108" width="40" height="36" rx="4"
        fill="#0D1F33" stroke="#58A6FF" stroke-width="1"/>
  <text x="175" y="131" text-anchor="middle" fill="#58A6FF"
        font-family="Courier New, monospace" font-size="24" font-weight="bold">p</text>

  <!-- Opening brace -->
  <text x="210" y="131" text-anchor="middle" fill="#E6EDF3"
        font-family="Courier New, monospace" font-size="24" font-weight="bold"> { </text>

  <!-- Part 2: Property "color" -->
  <rect x="230" y="108" width="90" height="36" rx="4"
        fill="#0D2818" stroke="#3FB950" stroke-width="1"/>
  <text x="275" y="131" text-anchor="middle" fill="#3FB950"
        font-family="Courier New, monospace" font-size="24" font-weight="bold">color</text>

  <!-- Colon between property and value -->
  <text x="325" y="131" text-anchor="middle" fill="#E6EDF3"
        font-family="Courier New, monospace" font-size="24" font-weight="bold">:</text>

  <!-- Part 3: Value "blue" -->
  <rect x="332" y="108" width="70" height="36" rx="4"
        fill="#1A1040" stroke="#7C5CBF" stroke-width="1"/>
  <text x="367" y="131" text-anchor="middle" fill="#7C5CBF"
        font-family="Courier New, monospace" font-size="24" font-weight="bold">blue</text>

  <!-- Semicolon and closing brace -->
  <text x="418" y="131" text-anchor="middle" fill="#E6EDF3"
        font-family="Courier New, monospace" font-size="24" font-weight="bold">; }</text>

  <!-- Declaration label (pointing up) -->
  <line x1="318" y1="100" x2="318" y2="78"
        stroke="#D29922" stroke-width="1"/>
  <text x="318" y="66" text-anchor="middle" fill="#D29922"
        font-family="Courier New, monospace" font-size="12">Declaration</text>
  <text x="318" y="50" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11">property + value together</text>

  <!-- Selector label -->
  <line x1="175" y1="146" x2="175" y2="180"
        stroke="#30363D" stroke-width="1"/>
  <text x="175" y="198" text-anchor="middle" fill="#58A6FF"
        font-family="Courier New, monospace" font-size="12">Selector</text>
  <text x="175" y="214" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11">targets element</text>

  <!-- Property label -->
  <line x1="275" y1="146" x2="275" y2="180"
        stroke="#30363D" stroke-width="1"/>
  <text x="275" y="198" text-anchor="middle" fill="#3FB950"
        font-family="Courier New, monospace" font-size="12">Property</text>
  <text x="275" y="214" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11">what to change</text>

  <!-- Value label -->
  <line x1="367" y1="146" x2="367" y2="180"
        stroke="#30363D" stroke-width="1"/>
  <text x="367" y="198" text-anchor="middle" fill="#7C5CBF"
        font-family="Courier New, monospace" font-size="12">Value</text>
  <text x="367" y="214" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11">what to set it to</text>

  <!-- Bottom note -->
  <text x="340" y="255" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="12">A CSS rule = selector + one or more declarations wrapped in curly braces.</text>
</svg>
