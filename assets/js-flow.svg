<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>How JavaScript works</title>
  <desc>Diagram showing the three-step flow: user action triggers JavaScript which updates the page</desc>

  <style>
    @keyframes dash { to { stroke-dashoffset: -20; } }
    #arrow-1 { animation: dash 0.4s linear infinite; }
    #arrow-2 { animation: dash 0.4s linear infinite; animation-delay: -0.2s; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="300" fill="#0D1117"/>

  <!-- Top label -->
  <text x="340" y="30" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11"
        letter-spacing="0.15em">HOW JAVASCRIPT WORKS</text>

  <!-- Box 1: User Action -->
  <rect x="30" y="118" width="140" height="64" rx="8"
        fill="#161B22" stroke="#58A6FF" stroke-width="1"/>
  <text x="100" y="142" text-anchor="middle" fill="#E6EDF3"
        font-family="Courier New, monospace" font-size="13" font-weight="bold">User Action</text>
  <text x="100" y="162" text-anchor="middle" fill="#58A6FF"
        font-family="Courier New, monospace" font-size="11">clicks a button</text>

  <!-- Box 2: JavaScript -->
  <rect x="270" y="118" width="140" height="64" rx="8"
        fill="#161B22" stroke="#D29922" stroke-width="1"/>
  <text x="340" y="142" text-anchor="middle" fill="#E6EDF3"
        font-family="Courier New, monospace" font-size="13" font-weight="bold">JavaScript</text>
  <text x="340" y="162" text-anchor="middle" fill="#D29922"
        font-family="Courier New, monospace" font-size="11">runs your code</text>

  <!-- Box 3: Page Updates -->
  <rect x="510" y="118" width="140" height="64" rx="8"
        fill="#161B22" stroke="#3FB950" stroke-width="1"/>
  <text x="580" y="142" text-anchor="middle" fill="#E6EDF3"
        font-family="Courier New, monospace" font-size="13" font-weight="bold">Page Updates</text>
  <text x="580" y="162" text-anchor="middle" fill="#3FB950"
        font-family="Courier New, monospace" font-size="11">no reload needed</text>

  <!-- Arrow 1 -->
  <line id="arrow-1" x1="172" y1="150" x2="268" y2="150"
        stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4"
        marker-end="url(#arrow)"/>

  <!-- Arrow 2 -->
  <line id="arrow-2" x1="412" y1="150" x2="508" y2="150"
        stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4"
        marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <text x="220" y="108" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11">event detected</text>
  <text x="460" y="108" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11">DOM updated</text>

  <!-- Code example block -->
  <rect x="140" y="224" width="400" height="44" rx="6"
        fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="340" y="240" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11">Example:</text>
  <text x="340" y="258" text-anchor="middle" fill="#3FB950"
        font-family="Courier New, monospace" font-size="12">button.addEventListener('click', () =&gt; { score++; })</text>

</svg>
