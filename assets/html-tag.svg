<svg width="100%" viewBox="0 0 680 280" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Anatomy of an HTML element</title>
  <desc>Diagram showing the three parts of an HTML element: opening tag, content, and closing tag</desc>

  <!-- Background -->
  <rect width="680" height="280" fill="#0D1117"/>

  <!-- Top label -->
  <text x="340" y="30" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="11"
        letter-spacing="0.15em">ANATOMY OF AN HTML ELEMENT</text>

  <!-- Part 1: Opening tag -->
  <rect x="155" y="88" width="72" height="36" rx="4"
        fill="#0D1F33" stroke="#58A6FF" stroke-width="1"/>
  <text x="191" y="111" text-anchor="middle" fill="#58A6FF"
        font-family="Courier New, monospace" font-size="28" font-weight="bold">&lt;h1&gt;</text>

  <!-- Part 2: Content -->
  <rect x="248" y="88" width="184" height="36" rx="4"
        fill="#0D2818" stroke="#3FB950" stroke-width="1"/>
  <text x="340" y="111" text-anchor="middle" fill="#E6EDF3"
        font-family="Courier New, monospace" font-size="28" font-weight="bold">Hello World</text>

  <!-- Part 3: Closing tag -->
  <rect x="440" y="88" width="88" height="36" rx="4"
        fill="#1A1040" stroke="#7C5CBF" stroke-width="1"/>
  <text x="484" y="111" text-anchor="middle" fill="#7C5CBF"
        font-family="Courier New, monospace" font-size="28" font-weight="bold">&lt;/h1&gt;</text>

  <!-- Arrow: opening tag -->
  <line x1="191" y1="126" x2="191" y2="160"
        stroke="#30363D" stroke-width="1"/>
  <text x="191" y="178" text-anchor="middle" fill="#58A6FF"
        font-family="Courier New, monospace" font-size="13">Opening tag</text>

  <!-- Arrow: content -->
  <line x1="340" y1="126" x2="340" y2="160"
        stroke="#30363D" stroke-width="1"/>
  <text x="340" y="178" text-anchor="middle" fill="#3FB950"
        font-family="Courier New, monospace" font-size="13">Content</text>

  <!-- Arrow: closing tag -->
  <line x1="484" y1="126" x2="484" y2="160"
        stroke="#30363D" stroke-width="1"/>
  <text x="484" y="178" text-anchor="middle" fill="#7C5CBF"
        font-family="Courier New, monospace" font-size="13">Closing tag</text>

  <!-- Bottom note -->
  <text x="340" y="220" text-anchor="middle" fill="#8B949E"
        font-family="Courier New, monospace" font-size="12">The closing tag is identical to the opening tag — but with a / before the name.</text>
</svg>
