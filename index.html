<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>learndev</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Screen 1: Splash -->
  <div id="splash" class="screen">
    <h1 class="splash-title">LEARNDEV</h1>
    <p class="splash-tagline">Learn to build. One concept at a time.</p>
    <button class="btn-primary" onclick="startGame()">START</button>
  </div>

  <!-- Screen 2: Map -->
  <div id="map-screen" class="screen">
    <h2 class="map-heading">YOUR LEARNING PATH</h2>
    <div class="map-container" id="map-container"></div>
  </div>

  <!-- Screen 3: Stage -->
  <div id="stage-screen" class="screen">
    <div class="stage-header">
      <button class="stage-back-btn" onclick="showMap()">← MAP</button>
      <span class="stage-title-text" id="stage-title"></span>
      <span class="stage-phase-label" id="stage-phase"></span>
    </div>
    <div id="stage-content"></div>
    <div class="stage-nav">
      <button id="btn-back" onclick="stagePrev()">← BACK</button>
      <button id="btn-next" onclick="stageNext()">NEXT →</button>
    </div>
  </div>

  <!-- Screen 4: Reference -->
  <div id="reference-screen" class="screen">
    <div class="stage-header">
      <button class="stage-back-btn" onclick="showMap()">← BACK</button>
      <span class="stage-title-text">QUICK REFERENCE</span>
      <span class="stage-phase-label" id="ref-stage-name"></span>
    </div>
    <div class="ref-grid" id="ref-cards"></div>
    <div class="stage-nav">
      <span></span>
      <button id="btn-next" onclick="startMatching()">NEXT →</button>
    </div>
  </div>

  <!-- Screen 5: Matching -->
  <div id="matching-screen" class="screen">
    <div class="stage-header">
      <button class="stage-back-btn" onclick="showReference()">← BACK</button>
      <span class="stage-title-text" id="match-title">MATCH THE TERMS</span>
      <span class="stage-phase-label" id="match-round">Round 1 of 2</span>
    </div>
    <div class="match-area" id="match-area">
      <div class="match-column" id="match-terms"></div>
      <div class="match-column" id="match-definitions"></div>
    </div>
    <div class="match-status" id="match-status"></div>
    <button id="match-next" class="btn-primary" onclick="startQuiz()" style="display: none;">NEXT →</button>
  </div>

  <!-- Screen 6: Quiz -->
  <div id="quiz-screen" class="screen">
    <div class="quiz-header">
      <span class="quiz-progress" id="quiz-progress">Question 1 of 8</span>
      <span class="quiz-score" id="quiz-score">Score: 0</span>
    </div>
    <div class="question-box">
      <div class="quiz-type-label" id="quiz-type-label">MULTIPLE CHOICE</div>
      <p class="question-text" id="quiz-question"></p>
    </div>
    <div class="quiz-answers" id="quiz-answers"></div>
    <div class="quiz-feedback" id="quiz-feedback" style="display: none;">
      <div class="quiz-feedback-banner" id="quiz-feedback-banner"></div>
      <p class="quiz-feedback-explanation" id="quiz-feedback-explanation"></p>
      <button class="btn-primary" id="quiz-next" onclick="nextQuizQuestion()">NEXT →</button>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="engine.js"></script>
</body>
</html>
